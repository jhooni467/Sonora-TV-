name: SONORA Bridge validation

on:
  push:
    branches: [main, "feature/sonora-tv-pairing"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install bridge dependencies
        working-directory: server
        run: npm install
      - name: Check bridge syntax
        run: node --check server/server.js
      - name: Test pairing and WebSocket connectivity
        working-directory: server
        run: node smoke-test.js
      - name: Check inline JavaScript syntax
        run: node server/check-html.js
      - name: Check frontend files
        run: |
          test -s index.html
          test -s receiver.html
          grep -q "/api/tv/session" receiver.html
          grep -q "/api/pair/join" server/server.js
